name: "Release Radar Changelog"
description: "Turn a commit range into a categorized changelog with AI, and open it as a pull request."
author: "Vansh Kapoor"

branding:
  icon: "radio"
  color: "purple"

inputs:
  github-token:
    description: "Token used to read commits and open the PR. Needs Contents: write and Pull requests: write."
    required: true
    default: ${{ github.token }}
  ai-provider:
    description: "anthropic | openai | groq | google"
    required: false
    default: "anthropic"
  ai-api-key:
    description: "API key for the chosen AI provider. Store it as a repository secret."
    required: true
  from-ref:
    description: "Start of the range. Defaults to the tag before the one being released."
    required: false
  to-ref:
    description: "End of the range. Defaults to the pushed tag, or the default branch."
    required: false
  detailed-analysis:
    description: "Send file diffs to the AI so vague commit messages still produce accurate entries. Adds roughly 10-20k input tokens per run - leave off unless your key has the headroom."
    required: false
    default: "false"
  detailed:
    description: "Deprecated alias for detailed-analysis. Kept so existing workflows keep working."
    required: false
    default: "false"
  publish-target:
    description: "pull-request | github-release | markdown-only"
    required: false
    default: "pull-request"
  version:
    description: "Version label for the PR title and branch name. Defaults to the pushed tag."
    required: false

outputs:
  markdown:
    description: "The generated changelog markdown."
  suggested-version:
    description: "Suggested next version from the classified changes, e.g. v1.5.0. Empty when the range start is not a parseable version."
  suggested-bump:
    description: "major | minor | patch. Empty when no suggestion was possible."
  published-url:
    description: "URL of the created pull request or draft release, when one was made."
  skipped:
    description: "true when there was nothing to do (e.g. no previous tag, or no commits in range)."
  diff-files-sent:
    description: "Detailed analysis only: how many files' diffs were sent to the AI."
  diff-chars-sent:
    description: "Detailed analysis only: total characters of diff sent to the AI."

runs:
  using: "node20"
  main: "action/index.js"
