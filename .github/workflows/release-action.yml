# Keeps the floating major tag (v1) pointing at the newest v1.x.y release, so
# workflows that use `@v1` pick up fixes without re-pinning.
#
# This is maintenance for THIS repository. It is not the template for users —
# that is action/example-workflow.yml.
#
# The trigger deliberately uses the plain `v*` glob rather than a character-class
# pattern: the exact semantics of `+` and `[]` in GitHub's filter syntax are easy
# to get subtly wrong, so the semver check lives in the step below where it is a
# plain shell regex that can be read and reasoned about directly.

name: Move floating major tag

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # required to push the moved tag

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move major tag to this commit
        env:
          # Passed through the environment rather than interpolated into the
          # script body, so the tag name can never be treated as shell syntax.
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Only exact vMAJOR.MINOR.PATCH releases move the floating tag.
          # Pre-releases (v1.2.3-beta.1) and anything else are skipped, so a
          # beta can never become what `@v1` resolves to.
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "$RELEASE_TAG is not a plain vX.Y.Z release tag — leaving the major tag alone."
            echo "Skipped: \`$RELEASE_TAG\` is not a plain vX.Y.Z tag." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          MAJOR="${RELEASE_TAG%%.*}"   # v1.2.3 -> v1
          echo "Release tag: $RELEASE_TAG"
          echo "Major tag:   $MAJOR -> $GITHUB_SHA"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # -f because the whole point is to move an existing tag. This is the
          # only force-push in the repo, and it only ever touches the major tag.
          git tag -f "$MAJOR" "$GITHUB_SHA"
          git push origin -f "refs/tags/$MAJOR"

          echo "\`$MAJOR\` now points at \`$GITHUB_SHA\` (from \`$RELEASE_TAG\`)." >> "$GITHUB_STEP_SUMMARY"
